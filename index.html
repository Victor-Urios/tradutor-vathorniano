<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tradutor de Vathorniano</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #14161c;
      color: #e8e8ee;
      margin: 0;
      padding: 24px 16px;
    }
    main { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p.sub { color: #9a9fb0; margin: 0 0 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    textarea {
      width: 100%;
      height: 220px;
      resize: vertical;
      padding: 12px;
      font-size: 1rem;
      color: inherit;
      background: #1e212b;
      border: 1px solid #333848;
      border-radius: 10px;
    }
    textarea:focus { outline: 2px solid #6c8cff; border-color: transparent; }
    details { margin-top: 20px; color: #e8e8ee; }
    ul { columns: 2; padding-left: 18px; }
    li b { color: #8fd0a0; }
  </style>
</head>
<body>
  <main>
    <h1>Tradutor de Vathorniano</h1>
    <p class="sub">Digite em qualquer campo: o outro é traduzido automaticamente. Sílabas repetidas aparecem como (c/n).</p>

    <div class="grid">
      <div>
        <label for="normal">Português</label>
        <textarea id="normal" placeholder="Escreva aqui..."></textarea>
      </div>
      <div>
        <label for="custom">Vathorniano</label>
        <textarea id="custom" placeholder="Ou escreva aqui..."></textarea>

        <label for="spoken" style="margin-top: 16px;">Falado</label>
        <textarea id="spoken" readonly style="height: 120px;" placeholder="A pronúncia aparece aqui..."></textarea>
      </div>
    </div>

    <details>
      <summary style="cursor:pointer; max-width: max-content;">Tabela de letras</summary>
      <ul id="dict"></ul>
    </details>
  </main>

  <script src="translator.js"></script>
</body>
</html>
